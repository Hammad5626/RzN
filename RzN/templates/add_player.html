{% extends "base.html" %}

{% block content %}
<h1 class="mb-4">Add Player</h1>

<div class="card p-4">
    <form method="post" class="row g-3">
        {% csrf_token %}
        <div class="col-md-6">
            <label class="form-label">Player Name</label>
            <input type="text" class="form-control" name="name" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">HQ Level</label>
            <input type="number" class="form-control" name="hq_level" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Power</label>
            <input type="number" class="form-control" name="power" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Country</label>
            <select id="country" name="country" class="form-select">
                {% for c in countries %}
                <option value="{{ c.id }}" data-multiple="{{ c.has_multiple_timezones }}">
                    {{ c.flag }} {{ c.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">Timezone</label>
            <select id="timezone" name="timezone" class="form-select"></select>
        </div>

        <div class="col-md-3 form-check mt-3">
            <input type="checkbox" class="form-check-input" name="is_active" id="activeCheck">
            <label class="form-check-label" for="activeCheck">Active</label>
        </div>
        <div class="col-md-3 form-check mt-3">
            <input type="checkbox" class="form-check-input" name="is_key_player" id="keyCheck">
            <label class="form-check-label" for="keyCheck">Key Player</label>
        </div>

        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-success">Add Player</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
const countrySelect = document.getElementById('country')
const tzSelect = document.getElementById('timezone')

async function loadTimezones() {
    const countryId = countrySelect.value
    const res = await fetch(`/api/timezones/${countryId}/`)
    const data = await res.json()
    tzSelect.innerHTML = ''
    if (data.length <= 1) {
        tzSelect.style.display = 'none'
    } else {
        tzSelect.style.display = 'inline'
        data.forEach(tz => {
            const opt = document.createElement('option')
            opt.value = tz.id
            opt.textContent = `${tz.zone_name} (${tz.gmt_offset_name})`
            tzSelect.appendChild(opt)
        })
    }
}

countrySelect.addEventListener('change', loadTimezones)
loadTimezones()
</script>
{% endblock %}
